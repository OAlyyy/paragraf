services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: paragraf
      POSTGRES_PASSWORD: paragraf
      POSTGRES_DB: paragraf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paragraf -d paragraf"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://paragraf:paragraf@db:5432/paragraf
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    # Without a healthcheck, `docker compose up --wait` treats "container started"
    # as ready, before migrations and uvicorn are up. The slim image has no curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
